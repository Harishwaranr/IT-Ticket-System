
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tickets - IT Support</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container">
        <h1>My Tickets</h1>
        <p>View and track your submitted IT complaints.</p>

        <table>
            <thead>
                <tr>
                    <th>Ticket ID</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="ticket-list">
                <tr>
                    <td colspan="6">Loading tickets...</td>
                </tr>
            </tbody>
        </table>

        <p><a href="/dashboard">Back to Dashboard</a></p>
    </div>

    <script src="/static/my_tickets.js"></script>
</body>
</html>
