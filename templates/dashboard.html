
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard - IT Ticket System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container dashboard">

        <h1>Employee Dashboard</h1>
        <p>Welcome to your IT Support Dashboard!</p>

        <div class="dashboard-actions">

            <div class="dashboard-card">
                <h2>Raise a Ticket</h2>
                <p>Report a new IT issue or technical problem.</p>
                <a href="/new-ticket">Create New Ticket</a>
            </div>

            <div class="dashboard-card">
                <h2>My Tickets</h2>
                <p>View and track your submitted complaints.</p>
                <a href="/my-tickets">View My Tickets</a>
            </div>

            <div class="dashboard-card">
                <h2>Help & FAQs</h2>
                <p>Find solutions to common IT problems.</p>
                <a href="/help">Get Help</a>
            </div>

        </div>

        <a href="/" class="back-home">Back to Home</a>

    </div>

</body>
</html>
